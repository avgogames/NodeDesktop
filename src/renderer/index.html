<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';">
  <title>System Monitor</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <header class="headerbar">
    <div class="headerbar-start">
      <div class="search" data-view-only="processes">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 1a5.5 5.5 0 0 1 4.38 8.82l3.65 3.65-1.06 1.06-3.65-3.65A5.5 5.5 0 1 1 6.5 1zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>
        <input id="search" type="search" placeholder="Search processes" aria-label="Search processes" autocomplete="off">
      </div>
    </div>

    <nav class="view-switcher" role="tablist" aria-label="Views">
      <button role="tab" data-view="processes" aria-selected="true">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h2v2H2zm4 .25h8v1.5H6zM2 7h2v2H2zm4 .25h8v1.5H6zM2 11h2v2H2zm4 .25h8v1.5H6z"/></svg>
        <span>Processes</span>
      </button>
      <button role="tab" data-view="resources" aria-selected="false">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 13.5h14V15H1zM2 11l3.5-4.5 3 2.5L13 3l1.2.9-5.4 7.2-3-2.5L3.2 12z"/></svg>
        <span>Resources</span>
      </button>
      <button role="tab" data-view="filesystems" aria-selected="false">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm.5 1.5v6h9v-6zm0 7.5v1.5h9V11zM10 12a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0z"/></svg>
        <span>File Systems</span>
      </button>
    </nav>

    <div class="headerbar-end">
      <button id="filter-button" class="icon-button" data-view-only="processes" title="Process filter" aria-haspopup="menu">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 2.5h14L9.5 9v5l-3-1.5V9z"/></svg>
      </button>
      <button id="menu-button" class="icon-button" title="Main menu" aria-haspopup="menu">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v1.5H2zm0 4.25h12v1.5H2zm0 4.25h12V13H2z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="view-processes" class="view" role="tabpanel" aria-label="Processes">
      <div id="process-table" class="vtable" tabindex="0" role="grid" aria-label="Processes"></div>
      <footer class="actionbar">
        <span id="process-summary" class="dim"></span>
        <span class="spacer"></span>
        <button id="end-process-button" class="destructive" disabled>End Process</button>
      </footer>
    </section>

    <section id="view-resources" class="view" role="tabpanel" aria-label="Resources" hidden>
      <div class="resources-scroll">
        <article class="card" id="card-cpu">
          <h2>CPU</h2>
          <canvas class="chart"></canvas>
          <div class="legend legend-grid"></div>
        </article>
        <article class="card" id="card-memory">
          <h2>Memory and Swap</h2>
          <canvas class="chart"></canvas>
          <div class="legend"></div>
        </article>
        <article class="card" id="card-network">
          <h2>Network</h2>
          <canvas class="chart"></canvas>
          <div class="legend"></div>
        </article>
        <article class="card" id="card-disk">
          <h2>Disk</h2>
          <canvas class="chart"></canvas>
          <div class="legend"></div>
        </article>
      </div>
    </section>

    <section id="view-filesystems" class="view" role="tabpanel" aria-label="File Systems" hidden>
      <div class="table-scroll">
        <table id="fs-table" class="data-table">
          <thead>
            <tr>
              <th data-sort="device">Device</th>
              <th data-sort="mountpoint">Directory</th>
              <th data-sort="type">Type</th>
              <th data-sort="total" class="num">Total</th>
              <th data-sort="available" class="num">Available</th>
              <th data-sort="used" class="num">Used</th>
              <th data-sort="percent" class="usage-col">Usage</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
